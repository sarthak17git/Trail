<style>


    /* ===========================
   GOOGLE FONT
=========================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f8fbff;
}


/* ===========================
   NAVBAR
=========================== */

.navbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
}

.logo img{
    height:130px;
}

.nav-links{
    display:flex;
    gap:35px;
    list-style:none;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
}

.nav-links li a{
    text-decoration:none;
    color:#333;
    font-weight:600;
}

.nav-links li a.active{
    color:#0099ff;
}
/* ===========================
   PAGE HEADER
=========================== */

.works-page{
    padding:120px 8% 80px;
}

.works-heading{
    text-align:center;
    margin-bottom:50px;
}

.works-heading h1{

    font-size:45px;
    color:#0077cc;
    margin-bottom:10px;

}

.works-heading p{

    font-size:18px;
    color:#666;

}

/* ===========================
   GALLERY
=========================== */

.works-gallery{

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;

}

.work-item{

    overflow:hidden;
    border-radius:12px;
    background:#fff;
    box-shadow:0 5px 15px rgba(0,0,0,.12);
    transition:.3s;

}

.work-item:hover{

    transform:translateY(-8px);

    box-shadow:0 12px 25px rgba(0,0,0,.18);

}

.work-item img{

    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    display:block;

}

.work-item:hover img{

    transform:scale(1.08);

}

/* ===========================
   FOOTER
=========================== */

footer{

    background:#0077cc;
    color:#fff;
    text-align:center;
    padding:25px;
    margin-top:70px;

}

/* ===========================
   RESPONSIVE
=========================== */

@media(max-width:992px){

    .works-gallery{

        grid-template-columns:repeat(2,1fr);

    }

}

@media(max-width:768px){

    .works-heading h1{

        font-size:35px;

    }

    .works-gallery{

        grid-template-columns:1fr;

    }

    .work-item img{

        height:240px;

    }

}

/* ===========================
   LIGHTBOX
=========================== */

.lightbox{

    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.9);
    justify-content:center;
    align-items:center;
    z-index:9999;

}

.lightbox img{

    max-width:90%;
    max-height:85%;
    border-radius:10px;

}

.close{

    position:absolute;
    top:25px;
    right:40px;
    color:#fff;
    font-size:40px;
    cursor:pointer;

}

.prev,
.next{

    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(255,255,255,.2);
    color:#fff;
    border:none;
    font-size:35px;
    padding:10px 18px;
    cursor:pointer;
    border-radius:50%;

}

.prev{

    left:30px;

}

.next{

    right:30px;

}

.prev:hover,
.next:hover{

    background:#0099ff;

}
</style>
